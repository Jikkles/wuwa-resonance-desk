name: Update kits

# Separate from update-feeds.yml, and daily rather than 6-hourly, because this
# job is a different shape: ~140 requests across Fandom and Prydwen for data
# that changes when a patch ships, not when someone posts a video. Running it
# on the feed's cadence would be four times the traffic at two fan sites for
# the same answer.
#
# The wiki half of this job runs unattended and is what lands on patch-day
# morning: banner dates, debut patches, the versions.json confirmation pass,
# and the permanent event list — everything the game keeps, which is the one
# calendar Kuro's own news feed cannot answer, because the posts that
# announced most of it scrolled off years ago.
#
# The kit half does not. Prydwen answers a home connection and returns a flat
# 403 to a GitHub runner, so kit text has never once arrived from a scheduled
# run — fetch-kits.mjs logs "prydwen unreachable" and carries the previous
# kits forward untouched. A new Resonator's skills land when the script is run
# from a machine Prydwen will talk to. Don't wait on the cron for those.

on:
  schedule:
    # Two hours after the 04:00 UTC patch go-live. The old 03:40 predated the
    # move off midnight and would now fire while the servers were still down —
    # deriveCurrent() reads a date, not a clock, so it would have called the
    # patch live twenty minutes early and then found nothing published yet.
    - cron: "0 6 * * *"    # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Shared with update-feeds.yml: both jobs commit to the same branch, and the
# rebase-then-push dance is far less likely to matter if only one of them is
# writing at a time. The two schedules are also picked not to overlap — the
# feed runs 02/08/14/20, this one at 06:00 — so the group is the backstop for
# a slow run drifting into the next slot, not the thing doing the separating.
concurrency:
  group: desk-data
  cancel-in-progress: false

jobs:
  kits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No continue-on-error here, unlike the portrait and weapon steps in
      # update-feeds.yml. Those degrade to "no new art this cycle", which is
      # invisible and harmless. This one owns the resonator index, so a failure
      # is worth seeing — and the script now refuses to write rather than
      # writing something thin, so a red run means the files were left alone.
      - name: Build resonator index and kits
        run: node scripts/fetch-kits.mjs

      # Reads what the step above just wrote — every banner's real start and
      # end, off its convene page — and retires the matching estimates in
      # versions.json. Strictly after fetch-kits.mjs; it fetches nothing itself.
      - name: Confirm estimated phase dates
        run: node scripts/confirm-dates.mjs

      # The permanent event list, off the wiki's own Permanent Events category.
      # Here rather than in update-feeds.yml for the reason at the top of this
      # file: it is a Fandom job that answers a question which only changes
      # when a patch ships, and running it every six hours would be four times
      # the traffic for the same list. Kept independent of the kit half — a
      # Prydwen 403 must not cost the desk its event banners.
      - name: Resolve permanent events
        if: always()
        continue-on-error: true
        run: node scripts/fetch-permanents.mjs

      # The patch archive — every version the game has shipped and the events
      # that ran in it. Same host, same cadence and the same reasoning as the
      # step above: it answers a question that only changes when a patch ships.
      # It downloads no art, so it is the cheapest job here despite reading two
      # hundred and forty pages.
      - name: Resolve the patch archive
        if: always()
        continue-on-error: true
        run: node scripts/fetch-archive.mjs

      # always(), so that a Prydwen 403 taking the kit step down does not also
      # throw away the event banners the wiki step just fetched. The run still
      # goes red when a step failed, which is the part worth seeing; fetch-kits
      # refuses to write a thin file, so there is nothing half-made to commit.
      - name: Commit if changed
        if: always()
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/resonators.json data/kits.json data/versions.json data/permanents.json data/archive.json assets/events
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh kits $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
