name: Update feeds

on:
  schedule:
    # Every 6 hours, offset off the top of the clock rather than on it.
    # Kuro's patches now go live at 04:00 UTC, not midnight, so the run that
    # matters is the one after that — 08:00 gives the site four hours to put
    # its notices up. The offset also keeps all four slots clear of the kits
    # job at 06:00, which shares this workflow's concurrency group.
    - cron: "0 2,8,14,20 * * *"   # 02:00, 08:00, 14:00, 20:00 UTC
  workflow_dispatch:

# Needs Settings -> Actions -> Workflow permissions set to "Read and write",
# or the push step fails on every run.
permissions:
  contents: write

# A slow run must not overlap the next scheduled one and race the push. Shared
# with update-kits.yml, which commits to the same branch — one queue for
# everything that writes to data/ is simpler than two that have to be lucky.
concurrency:
  group: desk-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      # Picks up official key art within 6h of Kuro publishing a reveal post.
      # Independent of the feed run — one failing must not lose the other.
      - name: Resolve character art
        if: always()
        run: node scripts/fetch-art.mjs

      # Cut-out portraits for the small tiles. Prydwen sits behind Cloudflare
      # and may turn a runner away — that must cost the desk its portraits for
      # one cycle, not the whole run.
      - name: Resolve portraits
        if: always()
        continue-on-error: true
        run: node scripts/fetch-portraits.mjs

      # The event calendar, off Kuro's own patch notes and event notices. Same
      # host as the character art and the same reason to keep it separate: an
      # event notice that has not gone up yet is a normal Tuesday, not a run
      # that failed.
      - name: Resolve events
        if: always()
        run: node scripts/fetch-events.mjs

      # Icons for whatever those events pay out, resolved against Fandom. Runs
      # after the calendar because it reads the reward lines the step above just
      # wrote — a new patch's rewards are new items, and this is what turns them
      # from a sentence into the row of pictures on the event record. Fandom
      # serves Actions normally, unlike Prydwen.
      - name: Resolve reward icons
        if: always()
        continue-on-error: true
        run: node scripts/fetch-items.mjs

      # Weapon stats, passives and icons. Same host, same caveat, and kept a
      # separate step for the same reason: one turned-away request must not
      # take the other's data down with it.
      - name: Resolve weapons
        if: always()
        continue-on-error: true
        run: node scripts/fetch-weapons.mjs

      # English for the Chinese headlines, looked up rather than translated —
      # Kuro publish most of these notices on their own English site. Last,
      # because it reads the feed the first step wrote: a signal has to be in
      # the window before there is any point resolving a line for it. Not
      # allowed to fail the run, because a headline left in Chinese is the
      # desk's ordinary state and the badge already says so.
      - name: Translate signal headlines
        if: always()
        continue-on-error: true
        run: node scripts/translate-signals.mjs

      - name: Commit if changed
        if: always()
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/feed.json data/art.json data/events.json data/items.json data/portraits.json data/translations.json data/weapons.json assets/items assets/portraits assets/weapons
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have landed while this one was fetching.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
