name: Update feeds

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      - name: Commit if changed
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/feed.json
          git diff --staged --quiet || git commit -m "chore: refresh feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
