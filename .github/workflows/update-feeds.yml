name: Update feeds

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

# Needs Settings -> Actions -> Workflow permissions set to "Read and write",
# or the push step fails on every run.
permissions:
  contents: write

# A slow run must not overlap the next scheduled one and race the push.
concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      # Picks up official key art within 6h of Kuro publishing a reveal post.
      # Independent of the feed run — one failing must not lose the other.
      - name: Resolve character art
        if: always()
        run: node scripts/fetch-art.mjs

      # Cut-out portraits for the small tiles. Prydwen sits behind Cloudflare
      # and may turn a runner away — that must cost the desk its portraits for
      # one cycle, not the whole run.
      - name: Resolve portraits
        if: always()
        continue-on-error: true
        run: node scripts/fetch-portraits.mjs

      # Weapon stats, passives and icons. Same host, same caveat, and kept a
      # separate step for the same reason: one turned-away request must not
      # take the other's data down with it.
      - name: Resolve weapons
        if: always()
        continue-on-error: true
        run: node scripts/fetch-weapons.mjs

      - name: Commit if changed
        if: always()
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/feed.json data/art.json data/portraits.json data/weapons.json assets/portraits assets/weapons
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have landed while this one was fetching.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
